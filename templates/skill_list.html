{% extends 'base.html' %}
{% block title %}Навички — Internship Tracker{% endblock %}
{% block content %}
<h1 class="page-title">Навички</h1>
<div class="card">
  {% for skill in skills %}
    <a href="{{ skill.get_absolute_url }}" class="pill pill-neutral" style="text-decoration:none;">{{ skill.title }} · {{ skill.n }}</a>
  {% empty %}
    Навичок поки немає.
  {% endfor %}
</div>
{% include 'includes/pagination.html' %}
{% endblock %}
