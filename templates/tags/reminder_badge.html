<span class="reminder reminder-{{ reminder.urgency }}">

  {% if reminder.urgency == 'overdue' %}<strong>(прострочено)</strong>{% elif reminder.urgency == 'soon' %}<strong>(скоро)</strong>{% elif reminder.urgency == 'done' %}(виконано){% endif %}
</span>
